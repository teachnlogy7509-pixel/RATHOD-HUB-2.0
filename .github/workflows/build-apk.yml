name: Build Android APK
permissions:
  contents: write
on: {workflow_dispatch: {}, push: {branches: [main], paths: ['android-app/**']}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Add offline Hindi and emoji font pack
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core fonts-noto-ui-core
          mkdir -p android-app/app/src/main/assets/fonts
          cp "$(find /usr/share/fonts -iname 'NotoColorEmoji.ttf' | head -1)" android-app/app/src/main/assets/fonts/NotoColorEmoji.ttf
          cp "$(find /usr/share/fonts -iname 'NotoSansDevanagari-Regular.ttf' | head -1)" android-app/app/src/main/assets/fonts/DroidSansDevanagari-Regular.ttf
          cp "$(find /usr/share/fonts -iname 'NotoSans-Italic*.ttf' | head -1)" android-app/app/src/main/assets/fonts/NotoSans-Italic.ttf
      - run: gradle -p android-app :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: YPT-Study-by-Rathod-APK, path: android-app/app/build/outputs/apk/debug/app-debug.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: YPT Study by Rathod APK
          body: Latest Android build. Install app-debug.apk after allowing installs from your browser.
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
